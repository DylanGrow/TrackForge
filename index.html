<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0f">
  <meta name="description" content="TrackForge Pro is a fast, reliable, and privacy-focused GPS tracking progressive web application built for runners and cyclists.">
  <meta property="og:title" content="TrackForge Pro">
  <meta property="og:description" content="A fast, reliable, privacy-focused GPS tracker PWA.">
  <meta property="og:type" content="website">
  <title>TrackForge Pro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Canvas layer -->
  <div id="map-container">
  <canvas id="map-canvas">Your route will be drawn here.</canvas>
  </div>

  <!-- Top Error Banner -->
  <div id="error-banner" class="hidden" role="alert" aria-live="assertive"></div>

  <!-- Top UI -->
  <header class="top-bar glass-panel">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
      <h1>TrackForge</h1>
      <div id="gps-indicator" class="gps-dot"></div>
    </div>
    <div class="header-actions">
      <span id="clock-display" class="clock-display"></span>
      <button id="btn-power-mode" class="icon-btn" title="Power Save" aria-label="Power Save">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.19M15 6h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3.19M23 13v-2M11 6l-4 6h6l-4 6"/></svg>
      </button>
      <button id="btn-history" class="icon-btn" title="History" aria-label="History">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      </button>
    </div>
  </header>

  <main>
  <!-- Stats Grid -->
  <div class="stats-wrapper glass-panel">
    <div class="stat-box">
      <span class="stat-label">TIME</span>
      <span class="stat-value" id="display-time">00:00:00</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">DISTANCE (KM)</span>
      <span class="stat-value" id="display-dist">0.00</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">PACE (/KM)</span>
      <span class="stat-value" id="display-speed">--:--</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">STEPS</span>
      <span class="stat-value" id="display-steps">0</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-wrapper">
    <button id="btn-start" class="btn primary-btn pulse-glow">START TRACKING</button>
    <div id="active-controls" class="hidden active-controls-grid">
      <button id="btn-pause" class="btn secondary-btn">PAUSE</button>
      <button id="btn-stop" class="btn danger-btn hold-to-stop">HOLD TO STOP</button>
    </div>
  </div>
  </main>

  <!-- History Panel -->
  <div id="panel-history" class="panel hidden glass-panel">
    <div class="panel-header">
      <h2>Session History</h2>
      <button class="close-panel icon-btn" title="Close Panel" aria-label="Close Panel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div id="history-list" class="history-list"></div>
  </div>

  <!-- Ultra-Low Power Overlay -->
  <div id="power-overlay" class="power-overlay hidden">
      <div class="power-time" id="power-time">00:00:00</div>
      <div class="power-dist" id="power-dist">0.00 KM</div>
      <div class="power-hint">TAP ANYWHERE TO WAKE</div>
  </div>

  <!-- Version Tag -->
  <div class="version-tag">v1.0.4-prod</div>

  <script src="app.js"></script>
</body>
</html>
